<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Treino de lógica</title>

    <style>
          </style>
  </head>

  <body>
    <h1>Lista de tarefas simples pra aquecer os dedos!</h1>
    <div class="main">
      <div class="in">
        <input type="text" id="texto" placeholder="digite tarefa..." />
        <button class="button" onclick="criarTarefa()">Criar</button>
      </div>

      <ul id="tarefas"></ul>
    </div>

    <script>
      function criarTarefa() {
        const tarefas = document.getElementById("tarefas");
        const texto = document.getElementById("texto");
        const tarefa = texto.value.trim();

        // Simples validação
        if (texto.value == "") return;

        // Criandas lis
        const li = document.createElement("li");
        li.innerHTML = `
                <span>${tarefa}</span>
                <button class="edit" onclick="edit(this)">Editar</butto>
                <button class="elim" onclick="elim(this)">Eliminar</butto>
            `;

        tarefas.appendChild(li);
        texto.value = "";
      }

      // Tarefa com enter
      document.getElementById("texto").addEventListener("keypress", (e) => {
        if (e.key === "Enter") criarTarefa();
      });

      // Editar tarefas
      function edit(button) {
        let li = button.parentElement;
        let span = li.querySelector("span");
        let novaTarefa = prompt("Edite: ", span.textContent);

        // Condição da edição
        if (novaTarefa !== null && novaTarefa.trim() !== "") {
          span.textContent = novaTarefa.trim();
        }
      }

      // Eliminar tarefas
      function elim(button) {
        let li = button.parentElement;
        tarefas.removeChild(li);
      }
    </script>
  </body>
</html>
