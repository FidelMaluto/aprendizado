<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista</title>
    <!-- <script src="script.js" defer></script> -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="tool">
            <input type="text" id="text" placeholder="Tarefa...">
            <button onclick="cadastra()">Cadastrar</button>
        </div>
        <ul id="lista"></ul>
    </div>

    <script>
        const text = document.getElementById("text");
        const lista = document.getElementById("lista");

        function cadastra() {
            const tarefa = text.value.trim();
            const li = document.createElement('li');

            if (text.value === "") return;

            li.innerHTML = `
                <span>${tarefa}</span>
                <button class="edit" onclick="edit(this)">Editar</button>
                <button class="elim" onclick="elim(this)">Eliminar</button>
            `;

            lista.appendChild(li);
            text.value = "";
        }

        function edit(butto) {
            let li = butto.parentElement;
            let span = li.querySelector('span');
            let novaTarefa = prompt('Edita: ', span.textContent);

            if (novaTarefa !== null && novaTarefa.trim() !== '') {
                span.textContent = novaTarefa.trim();
            }
        }

        function elim(butto) {
            let li = butto.parentElement;
            lista.removeChild(li);
        }

        document.getElementById("text").addEventListener('keypress', function (e) {
            if(e.key === "Enter") cadastra();
        })
        
    </script>
    
</body>
</html>
