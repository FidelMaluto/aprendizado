<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino</title>

    <style>
        body {
            background-color: blueviolet;
        }

        .main {
            margin: 20px auto;
            padding: 10px;
            background-color: #fff;
            border-radius: 8px;
            width: 20rem;
            box-shadow: 12px 10px 8px #000;
        }

        .in {
            display: flex;
            justify-content: space-between;
            padding: 6px;
        }

        input {
            padding: 10px;
            border: none;
            border-radius: 4px;
        }

        button {
            cursor: pointer;
            padding: 10px;
            border: none;
            border-radius: 4px;
            background-color: blueviolet;
        }
        
    </style>
    
</head>

<body>
    <div class="main">
        <div class="in">
            <input type="text" id="texto" placeholder="digite tarefa...">
            <button onclick="criarTarefa()">Criar</button>
        </div>

        <ul id="tarefas"></ul>
    </div>
</body>

</html>
