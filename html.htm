<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino</title>

    <style>
        body {
            background-color: blueviolet;
        }

        .main {
            margin: 20px auto;
            padding: 10px;
            background-color: #fff;
            border-radius: 8px;
            width: 20rem;
            box-shadow: 12px 10px 8px #000;
        }

        .in {
            display: flex;
            justify-content: space-between;
            padding: 6px;
        }

        input {
            padding: 10px;
            border: none;
            border-radius: 4px;
        }

        button {
            cursor: pointer;
            padding: 10px;
            border: none;
            border-radius: 4px;
            background-color: blueviolet;
        }

        ol {
            padding: 0px;
        }

        ol li {
            justify-content: space-between;
            display: flex;
            padding: 8px;
            background-color: #ccc;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 2px;
        }
        
    </style>
    
</head>

<body>
    <div class="main">
        <div class="in">
            <input type="text" id="texto" placeholder="digite tarefa...">
            <button onclick="criarTarefa()">Criar</button>
        </div>

        <ol id="tarefas"></ol>
    </div>

    <script>
        function criarTarefa() {
            const tarefas = document.getElementById('tarefas');
            const texto = document.getElementById('texto');
            const tarefa = texto.value.trim();

            // Simples validação
            if (texto.value == '') return;
            
            // Criandas lis
            const li = document.createElement('li');
            li.innerHTML = `
                <span>${tarefa}</span>
                <button class="edit" onclick="edit(this)">Editar</butto>
                <button class="elim" onclick="elim(this)">Eliminar</butto>
            `;

            tarefas.appendChild(li);
            texto.value = '';
            
        }

        // Criar com um click no Enter
        document.getElementById('texto').addEventListener('keypress', function (e){
            if (e.key === 'Enter') criarTarefa();
        });

        // Editar tarefas
       

        // Eliminar tarefas
        function elim(button) {
            const li = button.parentElement;
            tarefas.removeChild(li);
        }
        
    </script>
    
</body>

</html>
